name: Shanghai Air Crawler

on:
  schedule:
    # Temporary verification: run a lightweight smoke job every 5 minutes.
    - cron: "*/5 * * * *"
    # Daily crawler run at 00:10 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sh-air-crawler
  cancel-in-progress: false

jobs:
  schedule-smoke:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm schedule trigger
        run: date

  crawl:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 16 * * *'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler once
        run: python sh_air_crawler.py

      - name: Commit crawled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: add Shanghai air data $(date +'%Y-%m-%d %H:%M:%S %Z')"
            git push
          fi
